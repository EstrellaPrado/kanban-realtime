services:
  postgres:
    image: postgres:16
    container_name: kanban_postgres
    restart: always
    environment:
      POSTGRES_USER: kanban_user
      POSTGRES_PASSWORD: kanban_pass
      POSTGRES_DB: kanban_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: kanban_redis
    restart: always
    ports:
      - "6379:6379"
volumes:
  postgres_data: